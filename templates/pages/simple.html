{% extends "base.html" %}

{% block content %}
<article class="page">
    <h1>{{ heading }}</h1>
    <p class="lead">{{ lead }}</p>
    {% for section in sections %}
        <h2>{{ section.title }}</h2>
        <p>{{ section.text }}</p>
    {% endfor %}
    <p class="page-cta"><a class="button button-primary" href="{% url 'pages:quote' %}">Ask for a quote</a></p>
</article>
{% endblock %}
