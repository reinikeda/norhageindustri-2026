{% extends "base.html" %}
{% load static %}

{% block content %}
<article class="page">
    {% if page and page.image %}
        <img class="page-image" src="{{ page.image.url }}" alt="{{ heading }}">
    {% endif %}
    <h1>{{ heading }}</h1>
    {% if lead %}<p class="lead">{{ lead }}</p>{% endif %}
    {% if body %}<div class="page-body">{{ body|linebreaks }}</div>{% endif %}
    <p class="page-cta"><a class="button button-primary" href="{% url 'pages:quote' %}">Ask for a quote</a></p>
</article>
{% endblock %}
