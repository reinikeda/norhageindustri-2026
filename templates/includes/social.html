<ul class="social-list">
    {% for item in social_links %}
        <li>
            <a class="social-link" href="{{ item.url }}" target="_blank" rel="noopener noreferrer">
                {% if item.icon == "linkedin" %}
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="currentColor" d="M4.98 3.5A2.48 2.48 0 1 1 2.5 6a2.48 2.48 0 0 1 2.48-2.5ZM5 8.75H1.75V21h3.25V8.75ZM9.25 8.75H12.4v1.67h.05c.44-.83 1.52-1.71 3.13-1.71 3.35 0 3.97 2.2 3.97 5.07V21H16.3v-5.54c0-1.32-.02-3.02-1.84-3.02-1.84 0-2.12 1.44-2.12 2.93V21H9.25V8.75Z"/>
                    </svg>
                {% elif item.icon == "youtube" %}
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="currentColor" d="M23.5 6.2a3.03 3.03 0 0 0-2.13-2.15C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.37.45A3.03 3.03 0 0 0 .5 6.2 31.7 31.7 0 0 0 0 12a31.7 31.7 0 0 0 .5 5.8 3.03 3.03 0 0 0 2.13 2.15C4.5 20.4 12 20.4 12 20.4s7.5 0 9.37-.45a3.03 3.03 0 0 0 2.13-2.15A31.7 31.7 0 0 0 24 12a31.7 31.7 0 0 0-.5-5.8ZM9.75 15.57V8.43L15.84 12l-6.09 3.57Z"/>
                    </svg>
                {% else %}
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="currentColor" d="M22 12.07C22 6.5 17.52 2 12 2S2 6.5 2 12.07C2 17.1 5.66 21.24 10.44 22v-7.02H7.9v-2.91h2.54V9.84c0-2.52 1.49-3.91 3.77-3.91 1.09 0 2.24.2 2.24.2v2.48h-1.26c-1.24 0-1.63.78-1.63 1.57v1.89h2.78l-.44 2.91h-2.34V22C18.34 21.24 22 17.1 22 12.07Z"/>
                    </svg>
                {% endif %}
                <span>{{ item.name }}</span>
            </a>
        </li>
    {% endfor %}
</ul>
