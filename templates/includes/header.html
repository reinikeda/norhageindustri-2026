{% load static %}
<header class="site-header">
    <div class="header-inner">
        <a class="logo" href="{% url 'pages:home' %}">
            <img src="{% static 'img/logo.svg' %}" alt="" width="36" height="36">
            <span>
                <strong>{{ company_name }}</strong>
                <small>{{ company_tagline }}</small>
            </span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
            Menu
        </button>
        <nav id="site-nav" class="site-nav" aria-label="Main">
            <ul>
                {% for url_name, label in nav_items %}
                    <li>
                        {% url url_name as item_url %}
                        <a href="{{ item_url }}" {% if request.path == item_url %}aria-current="page"{% endif %}>{{ label }}</a>
                    </li>
                {% endfor %}
            </ul>
            <a class="button button-primary header-cta" href="{% url 'pages:quote' %}">Ask for a quote</a>
        </nav>
    </div>
</header>
